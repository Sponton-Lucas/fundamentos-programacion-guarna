<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shades of Purple</title>
    <style>
      :root {
        --bg-1: #130f2a;
        --bg-2: #1c153b;
        --panel: rgba(34, 24, 59, 0.82);
        --panel-border: rgba(198, 172, 255, 0.22);
        --text: #f4ecff;
        --muted: #d8c9ff;
        --soft: #b79cff;
        --mid: #8d66ff;
        --deep: #5f3dc4;
        --accent: #ef7dff;
        --shadow: rgba(15, 9, 31, 0.45);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(165, 127, 255, 0.25), transparent 28%),
          radial-gradient(circle at bottom right, rgba(239, 125, 255, 0.18), transparent 24%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
      }

      .card {
        width: min(920px, 90vw);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 30px 60px var(--shadow);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 28px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .brand-mark {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--soft), var(--accent));
        box-shadow: 0 0 18px rgba(239, 125, 255, 0.7);
      }

      .nav {
        display: flex;
        gap: 18px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .nav a {
        color: inherit;
        text-decoration: none;
        opacity: 0.8;
      }

      .content {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 32px;
        padding: 42px 32px 32px;
      }

      .hero {
        padding-right: 10px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(143, 103, 255, 0.16);
        border: 1px solid rgba(166, 139, 255, 0.25);
        color: var(--soft);
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 16px;
        font-size: clamp(2.7rem, 6vw, 5rem);
        line-height: 0.96;
        letter-spacing: -0.07em;
      }

      .subtitle {
        margin: 0 0 26px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
        max-width: 560px;
      }

      .actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.02em;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .primary {
        color: #fff;
        background: linear-gradient(135deg, var(--mid), var(--accent));
        box-shadow: 0 18px 30px rgba(143, 103, 255, 0.3);
      }

      .secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .swatches {
        display: grid;
        gap: 16px;
      }

      .swatch {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.02);
      }

      .color {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 2px 12px rgba(255,255,255,0.18);
      }

      .name {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .name strong {
        font-size: 0.98rem;
      }

      .name span {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 720px) {
        .content {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          gap: 14px;
        }

        .nav {
          justify-content: center;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Shades of Purple</span>
        </div>
        <nav class="nav" aria-label="main navigation">
          <a href="#">Palette</a>
          <a href="#">Design</a>
          <a href="#">Mood</a>
        </nav>
      </header>

      <section class="content">
        <div class="hero">
          <div class="eyebrow">Creative palette</div>
          <h1>Royal<br />violet.</h1>
          <p class="subtitle">
            A modern collection of luminous purples designed to feel artistic,
            confident, and immersive, from soft lilac accents to deep plum tones.
          </p>
          <div class="actions">
            <button class="button primary">Explore the palette</button>
            <button class="button secondary">View the moodboard</button>
          </div>
        </div>

        <aside class="swatches" aria-label="purple shades">
          <div class="swatch">
            <div class="color" style="background:#f3d9ff"></div>
            <div class="name"><strong>Lavender</strong><span>#F3D9FF</span></div>
          </div>
          <div class="swatch">
            <div class="color" style="background:#b79cff"></div>
            <div class="name"><strong>Soft Violet</strong><span>#B79CFF</span></div>
          </div>
          <div class="swatch">
            <div class="color" style="background:#8d66ff"></div>
            <div class="name"><strong>Electric Iris</strong><span>#8D66FF</span></div>
          </div>
          <div class="swatch">
            <div class="color" style="background:#5f3dc4"></div>
            <div class="name"><strong>Deep Plum</strong><span>#5F3DC4</span></div>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
